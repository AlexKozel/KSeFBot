name: KSeF smoke test

# Проверка клиента KSeF на тестовой среде МФ (api-test.ksef.mf.gov.pl).
# 1) Официальная утилита МФ (CertTestApp) входит самоподписанным сертификатом
#    со случайным тестовым NIP — так можно только в тестовой среде.
# 2) Выпускаем токен KSeF только с правом InvoiceRead — как сделает бета-пользователь.
# 3) Наш клиент входит этим токеном и читает фактуры.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # раз в неделю: ловим изменения API тестовой среды

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: https://api-test.ksef.mf.gov.pl/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test NIP
        run: echo "KSEF_NIP=$(node --experimental-strip-types scripts/random-nip.ts)" >> "$GITHUB_ENV"

      - name: XAdES login with self-signed certificate (official MF tool)
        run: |
          git clone --depth 1 https://github.com/CIRFMF/ksef-client-csharp.git /tmp/sdk
          cd /tmp/sdk/KSeF.Client.Tests.CertTestApp
          dotnet run --framework net8.0 -- --nip "$KSEF_NIP" --no-startup-warnings > /tmp/cert-app.log 2>&1 || true
          ACCESS=$(grep -oP 'AccessToken:\s*\K\S+' /tmp/cert-app.log || true)
          if [ -z "$ACCESS" ]; then
            grep -E "\[!\]|Kod:|Opis:|Exception|error" /tmp/cert-app.log | head -9 | while IFS= read -r l; do echo "::error title=cert-app::$l"; done
            exit 1
          fi
          echo "::add-mask::$ACCESS"
          echo "ACCESS=$ACCESS" >> "$GITHUB_ENV"

      - name: Issue KSeF tokens (read-only for the user flow, write-only for test data)
        run: |
          issue() { # $1 = имя переменной, $2 = права JSON, $3 = описание
            RESP=$(curl -sS -X POST "$API/tokens" -H "Authorization: Bearer $ACCESS" -H "Content-Type: application/json" \
              -d "{\"permissions\":$2,\"description\":\"$3\"}")
            TOKEN=$(echo "$RESP" | jq -r '.token // empty'); REF=$(echo "$RESP" | jq -r '.referenceNumber // empty')
            if [ -z "$TOKEN" ]; then echo "::error title=tokens::$(echo "$RESP" | head -c 400)"; exit 1; fi
            echo "::add-mask::$TOKEN"; echo "$1=$TOKEN" >> "$GITHUB_ENV"
            for i in $(seq 1 30); do # токен активируется асинхронно
              ST=$(curl -sS "$API/tokens/$REF" -H "Authorization: Bearer $ACCESS" | jq -r '.status // empty')
              [ "$ST" = "Active" ] && { echo "::notice title=token::$3: активен"; return 0; }
              [ "$ST" = "Failed" ] && { echo "::error title=token::$3: не активировался"; exit 1; }
              sleep 2
            done
            echo "::error title=token::$3: не стал Active (статус $ST)"; exit 1
          }
          issue KSEF_TOKEN '["InvoiceRead"]' "KSeFBot smoke read only"
          issue KSEF_SEED_TOKEN '["InvoiceWrite"]' "KSeFBot smoke seed invoices"

      - name: Our client — login with KSeF token and read invoices
        run: node --experimental-strip-types scripts/ksef-smoke.ts
