name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ksefbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ksefbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || {
            # Логи CI недоступны из рабочей среды Claude, поэтому выводим падения в аннотации.
            grep -E "^\s*not ok|error:|Error:|expected|actual" test-output.txt | head -9 | while IFS= read -r line; do
              echo "::error title=test::$line"
            done
            exit 1
          }
